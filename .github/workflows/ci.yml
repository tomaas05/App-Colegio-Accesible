name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  calidad:
    name: Estilo (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff~=0.17
      - run: ruff check .
      - run: ruff format --check .

  pruebas:
    name: Pruebas (pytest + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: despega
          POSTGRES_USER: despega
          POSTGRES_PASSWORD: despega
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Migraciones al día
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: Pruebas unitarias y de aceptación
        run: pytest
      - name: Instalar Chromium
        run: playwright install --with-deps chromium
      - name: Accesibilidad (axe + resoluciones)
        run: pytest -m e2e
