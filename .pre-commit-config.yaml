# Se instala una vez con:  pre-commit install
# Se ejecuta solo en cada commit; para revisar todo:  pre-commit run --all-files
# Archivos de terceros y bocetos exportados: no se tocan.
exclude: ^(static/vendor/|static/fonts/|docs/iteracion-1/bocetos/.*\.html$)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
